count-1=1
count-1-tooltip=[font=default-bold]1 台机器[/font]\n仅生成 1 台机器的生产单元。\n适合空间有限或仅需少量生产的场景。
count-half=半带
count-half-tooltip=[font=default-bold]半带模式 (Half)[/font]\n机器数量取以下两者的较少值：\n1. 消耗完 1 条传送带送来的最大需求原料所需机器数；\n2. 产物填满 [font=default-semibold]半条传送带[/font] 所需机器数。\n适合共线运输或单侧输出。
count-full=满带
count-full-tooltip=[font=default-bold]满带模式 (Full)[/font]\n机器数量取以下两者的较少值：\n1. 消耗完 1 条传送带送来的最大需求原料所需机器数；\n2. 产物填满 [font=default-semibold]整条传送带[/font] 所需机器数。\n适合满负荷最大化产出。
count-out-half=产出半带
count-out-half-tooltip=[font=default-bold]产出半带模式[/font]\n机器数量以产物填满 [font=default-semibold]半条传送带[/font] 为准。
count-cost-full=原料满带
count-cost-full-tooltip=[font=default-bold]原料满带模式[/font]\n机器数量以消耗最多的原料填满整条传送带为准；物品原料超过 5 种时，以填满半条传送带为准。
