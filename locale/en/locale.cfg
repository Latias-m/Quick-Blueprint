count-half-tooltip=[font=default-bold]Half Belt (Half)[/font]\nMachine count is the lesser of:\n1. Machines needed to consume 1 full belt of the most-used ingredient;\n2. Machines needed to fill a [font=default-semibold]half belt[/font] of products.\nIdeal for shared lanes or half-lane output.
count-full=Full
count-full-tooltip=[font=default-bold]Full Belt (Full)[/font]\nMachine count is the lesser of:\n1. Machines needed to consume 1 full belt of the most-used ingredient;\n2. Machines needed to fill a [font=default-semibold]full belt[/font] of products.\nIdeal for maximum throughput and full belt saturation.
count-out-half=Output Half
count-out-half-tooltip=[font=default-bold]Output Half Belt[/font]\nMachine count fills a [font=default-semibold]half belt[/font] of products.
count-cost-full=Input Full
count-cost-full-tooltip=[font=default-bold]Input Full Belt[/font]\nMachine count consumes a full belt of the most-used ingredient, or a half belt when there are more than five item ingredients.
